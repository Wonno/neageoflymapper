name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '5 7 13 * *' #monthly, a lot of primes - for no reason

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  test-and-lint:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Add Poetry to PATH (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        echo "C:\Users\runneradmin\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Poetry version
      run: poetry --version

    - name: Check lock file
      run: poetry check

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      run: |
        poetry install --no-interaction --no-root --all-groups

    - name: Run Linting
      if: matrix.os == 'ubuntu-latest'
      run: poetry run pylint --output-format github ./src ./tests
      continue-on-error: true

    - name: Run Tests
      run: poetry run pytest

    - name: Build Binary
      run: poetry pyinstaller build

    - name: Attach Binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: nea-geofly-mapper-${{ matrix.os }}
        path: |
          dist/pyinstaller/**/nea-geofly-mapper
          dist/pyinstaller/**/nea-geofly-mapper.exe
        if-no-files-found: error
        retention-days: 7
