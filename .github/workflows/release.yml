name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Semantic version bump level'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      run_lint:
        description: 'Run linting before release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.bump.outputs.tag_name }}
    permissions:
      contents: write
      actions: write
      attestations: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Poetry version
      run: poetry --version

    - name: Check lock file
      run: poetry check

    - name: Install dependencies
      run: |
        poetry install --no-interaction --no-root

    - name: Run Tests
      run: poetry run pytest

    - name: Run Linting
      if: ${{ github.event.inputs.run_lint == 'true' }}
      run: poetry run pylint --output-format github ./src ./tests

    - name: Bump Version
      id: bump
      run: |
        poetry version ${{ github.event.inputs.version_bump }}
        NEW_VERSION=$(poetry version -s)
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "tag_name=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Commit and Push Version Bump
      run: |
        git add pyproject.toml
        git commit -m "bump version to ${{ steps.bump.outputs.new_version }}"
        git tag "${{ steps.bump.outputs.new_version }}"
        git push --atomic origin main "${{ steps.bump.outputs.new_version }}"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: neageoflymapper-linux
          - os: windows-latest
            asset_name: neageoflymapper-windows.exe
          - os: macos-latest
            asset_name: neageoflymapper-macos
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.prepare.outputs.tag_name }}

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Add Poetry to PATH (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        echo "C:\Users\runneradmin\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install dependencies
      run: poetry install --no-interaction --no-root --all-groups

    - name: Build Binary
      run: poetry pyinstaller build

    - name: Rename binary
      shell: bash
      run: |
        BINARY_PATH="$(find dist/pyinstaller -maxdepth 2 -type f \( -name 'nea-geofly-mapper' -o -name 'nea-geofly-mapper.exe' \) | head -n 1)"
        mv "$BINARY_PATH" "dist/${{ matrix.asset_name }}"

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.asset_name }}

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts
        merge-multiple: true

    - name: Generate Checksums
      shell: bash
      run: |
        cd artifacts
        sha256sum * > ../checksums.txt

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: ${{ needs.prepare.outputs.tag_name }}
        files: |
          artifacts/*
          checksums.txt
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
